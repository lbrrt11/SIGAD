<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAD - Log de Atividades</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dashboard-body">

    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">⚖️</span>
            <h2>SGAD - Auditoria</h2>
        </div>
        
        <div class="nav-menu">
            <span id="mensagemBoasVindas" class="nav-user">Olá, Carregando...</span>
            <button id="btnVoltar" class="nav-link">Voltar a Tela Principal</button>
            <button id="btnSair" class="btn-sair">Sair</button>
        </div>
    </nav>

    <main class="dashboard-main">
        <h2 class="titulo-sessao" style="margin-bottom: 20px;">Últimas Atividades</h2>

        <div style="background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; min-height: 200px;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead id="cabecalhoTabela" style="border-bottom: 2px solid #eef3f7;">
                    <tr>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px;">DATA E HORA</th>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px;">USUÁRIO</th>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px;">AÇÃO</th>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px;">DETALHES</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td colspan="4" style="text-align: center; padding: 20px;">Carregando logs...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="./logs.js"></script>
</body>
</html>
