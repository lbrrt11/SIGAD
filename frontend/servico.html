<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAD - Serviço</title>
    <!-- Puxando o seu CSS oficial e o do Modal com os caminhos corrigidos -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./servico.css">
</head>
<body class="dashboard-body"> <!-- Essa classe salva o fundo azul gradiente -->

    <!-- NAVBAR EXATAMENTE IGUAL A DO DASHBOARD -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">⚖️</span>
            <h2>SGAD - <span id="nomeServicoHeader">Serviço</span></h2>
        </div>
        
        <div class="nav-menu">
            <span id="mensagemBoasVindas" class="nav-user">Olá, Carregando...</span>
            <button id="btnVoltar" class="nav-link">Voltar a Tela Principal</button>
            <button id="btnSair" class="btn-sair">Sair</button>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="dashboard-main">
        <h2 class="titulo-sessao" style="margin-bottom: 20px;">Modelos Disponíveis</h2>

        <!-- AQUI: A caixa branca que faltava para envelopar a tabela! -->
        <div style="background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; min-height: 200px;">
            <table id="tabelaModelos" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead id="cabecalhoTabela" style="display: none; border-bottom: 2px solid #eef3f7;">
                    <tr>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px;">NOME DO MODELO</th>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px;">NATUREZA</th>
                        <th style="padding: 12px 10px; color: var(--primary-blue, #003366); font-size: 14px; text-align: right;">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL DE PREENCHIMENTO -->
    <div id="modalPreenchimento" class="modal" style="display: none;">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h3 id="modalTitulo">Preencher Dados</h3>
                <span class="fechar-modal" id="btnFecharModal">&times;</span>
            </div>
            
            <div class="modal-corpo">
                <p style="margin-bottom: 15px; color: #666; font-size: 14px;">Preencha os campos abaixo para gerar o documento.</p>
                <form id="formVariaveis" class="grid-form"></form>
            </div>

            <!-- RODAPÉ ATUALIZADO COM BOTÃO LIMPAR -->
            <div class="modal-rodape" style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" style="padding: 8px 15px; border-radius: 4px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; color: #333; margin-right: auto;" id="btnLimparModal">Limpar Formulário</button>
                <button type="button" style="padding: 8px 15px; border-radius: 4px; border: 1px solid #003366; background: #fff; cursor: pointer; color: #003366; font-weight: bold;" id="btnVisualizar">Visualizar PDF</button>
                <button type="button" style="padding: 8px 15px; border-radius: 4px; border: none; background: #003366; color: white; cursor: pointer; font-weight: bold;" id="btnGerarPDF">Gerar PDF</button>
            </div>
        </div>
    </div>

    <script src="./servico.js"></script>
</body>
</html>
