<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAD - Gerenciamento de Funcionários</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dashboard-body">

    <!-- Navbar Superior -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">⚖️</span>
            <h2>SGAD - Equipe</h2>
        </div>
        
        <div class="nav-menu">
            <span id="mensagemBoasVindas" class="nav-user">Olá, Carregando...</span>
            <button id="btnVoltar" class="nav-link">Voltar a Tela Principal</button>
            <button id="btnSair" class="btn-sair">Sair</button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="dashboard-main">
        <div class="cabecalho-sessao">
            <h3 class="titulo-sessao">Lista de Funcionários</h3>
            
            <button id="btnNovoFuncionario" class="btn-primario" style="display: none;">
                + Novo Funcionário
            </button>
        </div>
        
        <!-- Tabela Atualizada com Nome Completo -->
        <div class="tabela-container">
            <table class="tabela-sgad">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Login (Usuário)</th>
                        <th>Nome Completo</th>
                        <th>Perfil</th>
                        <th id="colunaAcoes" style="display: none;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr><td colspan="5" style="text-align: center;">Carregando funcionários...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Modal Novo Funcionário -->
        <div id="modalNovoFuncionario" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h3 style="color: var(--primary-blue); margin-bottom: 20px;">Cadastrar Novo Funcionário</h3>
                
                <div class="form-group">
                    <label>Usuário (Login para entrar no sistema)</label>
                    <input type="text" id="novoLogin" placeholder="Ex: Pedro">
                </div>

                <!-- NOVO CAMPO: Nome Completo -->
                <div class="form-group">
                    <label>Nome Completo (Aparecerá nos documentos)</label>
                    <input type="text" id="novoNomeCompleto" placeholder="Ex: Pedro Silva Souza" required>
                </div>

                <div class="form-group">
                    <label>Nível de Acesso (Perfil)</label>
                    <select id="novoPerfil" required>
                        <option value="Funcionario">Funcionário</option>
                        <option value="Admin">Administrador (Admin)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="novaSenha" placeholder="Digite a senha">
                </div>
                
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="confirmaSenha" placeholder="Repita a senha">
                </div>

                <p id="erroModal" class="erro-mensagem"></p>

                <div class="modal-actions">
                    <button id="btnCancelarModal" class="btn-secundario">Cancelar</button>
                    <button id="btnSalvarFuncionario" class="btn-primario">Salvar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="funcionarios.js"></script>
</body>
</html>
