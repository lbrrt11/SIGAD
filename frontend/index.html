<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAD - Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>SGAD</h1>
            <p>Cartório de Notas de Itapetinga</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="login">Usuário</label>
                <input type="text" id="login" placeholder="Digite seu usuário" required>
            </div>

            <div class="form-group">
    <label for="senha">Senha</label>
    <div class="input-senha-container" style="position: relative; display: flex; align-items: center;">
        <input type="password" id="senha" placeholder="Digite sua senha" required style="width: 100%; padding-right: 40px;">
        
        <!-- Botão com o Olhinho Padrão (SVG) -->
        <span id="toggleSenha" style="position: absolute; right: 10px; cursor: pointer; color: #666; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;" title="Mostrar/Ocultar Senha">
            
            <!-- Desenho do Olho Aberto -->
            <svg id="olhoAberto" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>

            <!-- Desenho do Olho Fechado/Riscado (Fica escondido por padrão) -->
            <svg id="olhoFechado" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </span>
    </div>
</div>

            <button type="submit" id="btnEntrar">Entrar</button>
            <p id="mensagemErro" class="error-message"></p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
