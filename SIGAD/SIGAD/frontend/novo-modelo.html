<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAD - Cadastrar Novo Modelo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="dashboard-body">

    <!-- Navbar Superior -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">⚖️</span>
            <h2>SGAD - Modelos</h2>
        </div>
        <div class="nav-menu">
            <span id="mensagemBoasVindas" class="nav-user">Olá...</span>
            <button id="btnVoltar" class="nav-link">Voltar</button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="dashboard-main" style="max-width: 800px; margin: 0 auto;">
        <div class="cabecalho-sessao">
            <h3 class="titulo-sessao">Criar Novo Modelo de Documento</h3>
        </div>

        <div class="tabela-container">
            <form id="formNovoModelo" class="formulario-modelo">
                
                <!-- Nome do Modelo -->
                <div class="form-group">
                    <label for="nomeModelo">Nome do Modelo (Título do Documento)</label>
                    <input type="text" id="nomeModelo" placeholder="Ex: Procuração Ad Judicia - Geral" required>
                </div>

                <!-- Tipo de Documento -->
                <div class="form-group">
                    <label for="tipoDocumento">Tipo do Documento</label>
                    <select id="tipoDocumento" required>
                        <option value="">Selecione o tipo...</option>
                        <option value="Escritura">Escritura</option>
                        <option value="Procuração">Procuração</option>
                        <option value="Substabelecimento">Substabelecimento</option>
                        <option value="Ata Notarial">Ata Notarial</option>
                        <option value="Testamento">Testamento</option>
                        <option value="Certidão">Certidão</option>
                    </select>
                </div>

                <!-- Natureza do Documento (Fica desativado até escolher o Tipo) -->
                <div class="form-group">
                    <label for="naturezaDocumento">Natureza do Documento</label>
                    <select id="naturezaDocumento" disabled required>
                        <option value="">Primeiro selecione o Tipo do Documento</option>
                    </select>
                </div>

                <!-- Texto Base com Editor Simples -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                        <label for="textoBase">Texto Base do Documento</label>
                        <span class="dica-tags">Use <strong>{{nome_da_tag}}</strong> para criar campos preenchíveis.</span>
                    </div>
                    <textarea id="textoBase" rows="12" placeholder="Digite o texto do documento aqui. Exemplo: &#10;Eu, {{nome}}, portador do CPF {{cpf}}, nomeio {{procurador}} como meu representante..." required></textarea>
                </div>

                <!-- Mensagens de Feedback -->
                <p id="msgSucesso" style="color: #28a745; font-weight: bold; display: none; margin-bottom: 15px;">✓ Modelo cadastrado com sucesso!</p>
                <p id="msgErro" style="color: #d9534f; font-weight: bold; display: none; margin-bottom: 15px;"></p>

                <!-- Botões de Ação -->
                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="btn-primario">Salvar Modelo</button>
                </div>

            </form>
        </div>
    </main>

    <script src="novo-modelo.js"></script>
</body>
</html>
